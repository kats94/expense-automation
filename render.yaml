services:
  - type: web
    name: expense-automation
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn line_bot:app --bind 0.0.0.0:$PORT

  - type: cron
    name: monthly-fixed-costs
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "59 23 28-31 * *"
    startCommand: python run_monthly_fixed_costs.py
